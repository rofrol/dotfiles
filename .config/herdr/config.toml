onboarding = false

[theme]
name = "one-light"
auto_switch = false

[ui]
prompt_new_tab_name = false
tab_label = "title"

[ui.toast]
delivery = "system"

[usage]
enabled = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$peer", "$jobs", "$bg"],
]

[ui.sidebar]
show_agents_panel = false

[ui.sidebar.spaces]
tabs = true

[keys]
close_pane = "cmd+w"
