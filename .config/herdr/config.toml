onboarding = false

[theme]
name = "one-light"
auto_switch = false

[ui]
prompt_new_tab_name = false
tab_label = "title"

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "top-right"

[usage]
enabled = true
openai_api = true
anthropic_api = true

# Grants as the Console's Settings > Billing lists them (UTC days).
[[usage.anthropic_credits]]
usd = 200
granted = "2026-10-11"
expires = "2026-11-09"
included = true

[[usage.anthropic_credits]]
usd = 10
granted = "2026-09-27"
expires = "2027-09-28"

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$peer", "$jobs", "$bg"],
]

[ui.sidebar]
show_agents_panel = false

[ui.sidebar.spaces]
tabs = true
todo_command = "DOTFILES_AUTO=1 PATH=$HOME/scripts/dotfiles-shim:$PATH roagent todo start {space}"

[keys]
close_pane = ["cmd+w", "ctrl+shift+w"]
new_tab = ["prefix+c", "cmd+t", "ctrl+shift+t"]
reopen_tab = ["prefix+u", "cmd+shift+t"]
move_space_previous = "alt+shift+up"
move_space_next = "alt+shift+down"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit: review agent commits"
width = "90%"
height = "90%"

[workers]
default_agent = "pi-anthropic"
pre_tool_checks = [["python3", "~/.claude/hooks/delay-check.py"]]
