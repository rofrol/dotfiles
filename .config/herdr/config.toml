onboarding = false

[theme]
name = "one-light"
auto_switch = false

[ui]
prompt_new_tab_name = false
tab_label = "title"

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"
bottom_margin = 6

[usage]
enabled = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$peer", "$jobs", "$bg"],
]

[ui.sidebar]
show_agents_panel = false

[ui.sidebar.spaces]
tabs = true

[keys]
close_pane = ["cmd+w", "ctrl+shift+w"]
new_tab = ["prefix+c", "cmd+t", "ctrl+shift+t"]
reopen_tab = ["prefix+u", "cmd+shift+t"]
