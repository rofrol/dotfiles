onboarding = false

[theme]
name = "one-light"
auto_switch = false

[ui]
prompt_new_tab_name = false
tab_label = "title"

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "top-right"

[usage]
enabled = true
openai_api = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$peer", "$jobs", "$bg"],
]

[ui.sidebar]
show_agents_panel = false

[ui.sidebar.spaces]
tabs = true
todo_command = "~/scripts/todo-worker {space}"

[keys]
close_pane = ["cmd+w", "ctrl+shift+w"]
new_tab = ["prefix+c", "cmd+t", "ctrl+shift+t"]
reopen_tab = ["prefix+u", "cmd+shift+t"]
move_space_previous = "alt+shift+up"
move_space_next = "alt+shift+down"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit: review agent commits"
width = "90%"
height = "90%"

[workers]
pre_tool_checks = [["python3", "~/.claude/hooks/delay-check.py"]]
