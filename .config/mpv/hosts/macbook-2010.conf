# MacBookPro7,1: Core 2 Duo + GeForce 320M (nouveau), no hardware VP9/AV1 decoding.
# H.264 (avc1) up to 720p and 30 fps, which software decoding handles.
ytdl-format=bestvideo[vcodec^=avc1][height<=720][fps<=30]+bestaudio/best[height<=720]
hwdec=no
profile=fast
# yt-dlp from GitHub (~/.local/bin); Guix's was too old for YouTube.
script-opts-append=ytdl_hook-ytdl_path=/home/roman/.local/bin/yt-dlp
