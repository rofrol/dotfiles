# https://www.reddit.com/r/emacs/comments/cq94n2/help_emacs_evil_tmux_ubuntu_wsl2_big_delay_when/ewunyaf/
set -sg escape-time 0

# Distinguish Shift+Enter / Ctrl+Enter from plain Enter (pi, other CSI-u clients).
# tmux 3.5+; on 3.2-3.4 keep only `extended-keys on` (no csi-u format support).
set -g extended-keys on
set -g extended-keys-format csi-u

# Gnome-terminal doesn't support setting the clipboard using xterm escape sequences so we should ensure the set-clipboard option is off
# to copy both to clipboard
# https://unix.stackexchange.com/questions/348913/copy-selection-to-a-clipboard-in-tmux/349020#349020
# https://unix.stackexchange.com/questions/69111/how-to-target-multiple-selections-with-xclip/69134#comment606266_69134
set -g mouse on
setw -g mode-keys vi
#set-option -s set-clipboard off
set-option -s set-clipboard external
# paste with shift+right mouse button and select paste
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -i -sel p -f | xclip -i -sel c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'

# Other examples:
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#
#set -g @continuum-restore 'on'
#set -g @continuum-boot 'on'
#set -g @continuum-save-interval '5' # 5 min

#set -g status-right 'Continuum status: #{continuum_status}'

#If I vim-root, always be in git root
# https://github.com/tmux-plugins/tmux-resurrect/issues/277
#set -g @resurrect-processes 'false'

set-option -g default-shell /bin/zsh

## https://blog.kdheepak.com/emacsclient-and-tmux-split-navigation.html
## Smart pane switching with awareness of emacs splits.
## [Is there a way to prevent pane switching from overflowing past left and right boundaries? · Issue #1158 · tmux/tmux](https://github.com/tmux/tmux/issues/1158#issuecomment-344380259)
bind -n S-Up run "bash ~/scripts/tmux_navigate.sh -U"
bind -n S-Down run "bash ~/scripts/tmux_navigate.sh -D"
bind -n S-Right run "bash ~/scripts/tmux_navigate.sh -R"
bind -n S-Left run "bash ~/scripts/tmux_navigate.sh -L"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)g?(view|emacs?)(diff)?$' && tmux send-keys 'C-\\') || tmux select-pane -l"


# https://github.com/tmux-plugins/tmux-continuum/issues/30
set -g base-index 1         # start windows numbering at 1
setw -g pane-base-index 1   # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
# pi names its panes ("π - task - project") in the pane title; follow that
# instead of the command name, because every pi pane's command is just "node".
# Fall back to the command name for shells.
set -g automatic-rename-format '#{?#{m:π*,#T},#T,#{pane_current_command}}'
# renumber windows when a window is closed
set -g renumber-windows on

# Window list as a tab bar in kitty's powerline "angled" style: each tab ends
# in one shared chevron (U+25B6) whose tip bites toward the next tab, drawn in
# the tab's own colour on the bar colour - one cell per tab boundary. Each tab
# is 22 columns: 1 of padding, 19 of title (the pi pane title, falling back to
# the window name, long titles cut with an ellipsis; kitty shows no numbers),
# 1 of padding, 1 chevron. Up to 5 tabs fit a 156-column client.
set -g window-status-format '#[fg=#444444,bg=#999999] ▶'
set -g window-status-current-format '#[fg=#000000,bg=#eeeeee,bold] ▶'
set -g window-status-separator ''

# Tab-bar look (no green, no black): the bar is grey, inactive tabs are
# slightly grey (near-white) slabs, the active tab is pure white with bold
# text.
set -g status-style 'bg=#eeeeee,fg=#444444'
set -g window-status-style 'bg=#999999,fg=#444444'
set -g window-status-current-style 'bg=#eeeeee,fg=#000000,bold'
# The whole bar (tabs, session name, clock) sits at the top of the screen.
set -g status-position top
# The session name is the second to last element of the bar, right before the
# clock on the right; the tab list runs from the left edge. The stock limit of
# 10 columns cut the name to "[pi-code-q", so the right side is long enough.
set -g status-left ' '
set -g status-left-length 30
set -g status-right-length 60

# The tab bar carries the pane title now; the right side keeps the session name
# and clock only, so the title is not shown twice (the stock default repeats
# the pane title there).
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}[#{session_name}] %H:%M %d-%b-%y'

# Window/tab title: pi titles its own panes "π - task - project"; forward that
# to the terminal and fall back to "session (window)" for shells. Without
# set-titles the terminal title freezes at whatever command started tmux.
set -g set-titles on
set -g set-titles-string '#{?#{m:π*,#T},#T,#S (#W)}#{?session_alerts, [#{session_alerts}],}'

#conflicts with emacs' ctrl+h
#set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-power theme (https://github.com/wfxr/tmux-power), installed with tpm
# (set -g @plugin 'wfxr/tmux-power' in the plugin list above). Theme options
# must be set before tpm loads the plugins. Left segments stay empty so the
# tab list runs from the left edge; the session name goes before the clock and
# date on the right.
set -g @tmux_power_theme 'gold'
set -g @tmux_power_left_a ''
set -g @tmux_power_left_b ''
set -g @tmux_power_right_x '#S'

# Initialize TMUX plugin manager - loads tpm, tmux-sensible and tmux-power.
# exit 0 when tpm is absent, so run-shell does not report "returned 1".
# Synchronous (no -b): the overrides below must run after the plugins' own
# settings, and a backgrounded run-shell would race them.
run 'test ! -x "$HOME/.tmux/plugins/tpm/tpm" || "$HOME/.tmux/plugins/tpm/tpm"'

# tmux-power owns the bar's segments, but everything below restates them in
# the palette from before the theme (grey bar #bcbcbc, slightly grey inactive
# tabs #d0d0d0, white active tab #ffffff with bold text) while keeping the
# theme's powerline arrows (U+E0B0): arrow, padding, 16 of pi title without
# numbers, padding, arrow = 20 columns per tab.
# Equal tabs that fill the bar exactly: ~/scripts/tmux-tab-bar.sh measures the
# client and the window count and writes the title-field width into the window
# formats literally (tmux 3.8 formats cannot compute widths), giving every tab
# the same width and pushing the leftover columns into status-left. The
# session-name segment on the right is a fixed 24-column field cut with an
# ellipsis, and its OSC 8 link carries the whole name percent-encoded, so a
# hyperlink-aware terminal shows the full name when the mouse hovers it. The
# script runs from the hooks below and once when this file is sourced.
# The tabs are clickable (mouse is on; button 1 switches to the window), so
# each tab is an OSC 8 hyperlink (tmux://@N). Hyperlinks in Ghostty on macOS
# are still an open feature (discussion 3635, issues 5384 and 3565), and with
# mouse reporting on, clicks still go to tmux rather than opening the link.
set -as terminal-features ',*:hyperlinks'
set -g status-style 'bg=#eeeeee,fg=#444444'
# tmux-power also sets the legacy aliases status-bg/status-fg (its dark G0
# #262626), and tmux 3.8 keeps them as separate options: the unoccupied part
# of the bar (between the window list and status-right) is filled with
# status-bg, so status-style alone left that gap black. Set the aliases too.
set -g status-bg '#eeeeee'
set -g status-fg '#444444'
# Its message styles (rename prompt and friends) also carry G0; match them to
# the light palette so prompts do not show up dark.
set -g message-style 'bg=#eeeeee,fg=#000000,bold'
set -g message-command-style 'bg=#eeeeee,fg=#000000,bold'

# Recompute the tab bar when the geometry, the window count or the session
# name changes.
set-hook -g client-resized 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g window-linked 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g window-unlinked 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g window-closed 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g session-created 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g session-renamed 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
# The widths also go stale when a client attaches, detaches or switches to a
# session with another window count (all three consulted models flagged the
# gap) - same event-driven recompute, no timers.
set-hook -g client-attached 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g client-detached 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
set-hook -g client-session-changed 'run-shell "$HOME/scripts/tmux-tab-bar.sh"'
run-shell "$HOME/scripts/tmux-tab-bar.sh"


# https://stackoverflow.com/questions/41783367/tmux-tmux-true-color-is-not-working-properly/41786092#41786092
# test:
# curl -s https://raw.githubusercontent.com/JohnMorales/dotfiles/master/colors/24-bit-color.sh | bash
# To have 24 bit colors in Emacs: https://www.gnu.org/software/emacs/manual/html_mono/efaq.html#Colors-on-a-TTY
# test with: M-x list-colors-display
# Other:
# https://askubuntu.com/questions/925881/tmux-colors-not-working
# https://github.com/neovim/neovim/issues/7764#issuecomment-353831883
# https://github.com/neovim/neovim/issues/7764#issuecomment-411995268
set -g default-terminal 'tmux-256color'
